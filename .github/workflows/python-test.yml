# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Run tests
permissions:
  contents: read # access to check out code and install dependencies

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, reopened, review_requested, synchronize, ready_for_review]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v5
      - name: Install the latest version of uv with Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Lint with ruff
        uses: astral-sh/ruff-action@v3
        with:
          src: "./src"
      - name: Restore cached models
        id: cached-models-restore
        uses: actions/cache/restore@v6
        with:
          path: ./tests/data/models
          key: test-models
          restore-keys: |
            test-models
      - name: Install & test
        run: uv run --locked  --extra cpu pytest
      - name: Save models to cache
        # Save regardless of tests passing
        if: always() && matrix.python-version == '3.11'
        id: cached-models-save
        uses: actions/cache/save@v6
        with:
          path: ./tests/data/models
          key: ${{ steps.cached-models-restore.outputs.cache-primary-key }}
