name: autolamella-adaptive-polish
description: adaptive polish test protocol
version: '1.0'
tasks:
    Rough Milling:
        task_type: MILL_ROUGH
        parameters:
            sync_polishing_position: true
            sync_to_poi: true
        milling:
            mill_rough:
                name: Rough Milling
                field_of_view: 4.0e-05
                channel: ION
                alignment:
                    enabled: false
                    interval_enabled: false
                    interval: 30
                    rect:
                        left: 0.7
                        top: 0.3
                        width: 0.25
                        height: 0.4
                    use_autocontrast: true
                    use_autofocus: false
                    steps: 3
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 1536
                        - 1024
                        dwell_time: 1.0e-06
                        hfw: 0.00015
                        autocontrast: false
                        autogamma: false
                        save: false
                        drift_correction: false
                acquisition:
                    acquire_sem: false
                    acquire_fib: false
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 1536
                        - 1024
                        dwell_time: 1.0e-06
                        hfw: 0.00015
                        autocontrast: false
                        autogamma: false
                        save: false
                        drift_correction: false
                stages:
                -   name: Rough Cut
                    milling:
                        milling_current: 2.0e-09
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 4.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.1e-05
                        depth: 2.2e-06
                        spacing: 3.0e-06
                        upper_trench_height: 7.5e-06
                        lower_trench_height: 7.5e-06
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: Standard
                        config: {}
                -   name: Regular Cut 1
                    milling:
                        milling_current: 7.4e-10
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 4.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.1e-05
                        depth: 1.3e-06
                        spacing: 1.2e-06
                        upper_trench_height: 1.35e-06
                        lower_trench_height: 1.35e-06
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: Standard
                        config: {}
                -   name: Regular Cut 2
                    milling:
                        milling_current: 6.0e-11
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 4.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.05e-05
                        depth: 1.3e-06
                        spacing: 6.0e-07
                        upper_trench_height: 4.0e-07
                        lower_trench_height: 4.0e-07
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: Standard
                        config: {}
                -   name: Regular Cut 3
                    milling:
                        milling_current: 6.0e-11
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 4.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.0e-05
                        depth: 5.0e-07
                        spacing: 5.5e-07
                        upper_trench_height: 3.5e-07
                        lower_trench_height: 3.5e-07
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: Standard
                        config: {}
                -   name: Microexpansion
                    milling:
                        milling_current: 2.0e-09
                        spot_size: 5.0e-08
                        rate: 3.0e-11
                        dwell_time: 1.0e-06
                        hfw: 0.0002
                        patterning_mode: Serial
                        application_file: Si
                        preset: 30 keV; 2.5 nA
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 5.0e-07
                        height: 1.8e-05
                        depth: 1.0e-06
                        distance: 1.0e-05
                        name: MicroExpansion
                    strategy:
                        name: Standard
                        config: {}
        reference_imaging:
            imaging:
                beam_type: ELECTRON
                resolution:
                - 1536
                - 1024
                dwell_time: 1.0e-06
                hfw: 0.00015
                autocontrast: false
                autogamma: false
                save: false
                drift_correction: false
            field_of_view1: 0.00012
            field_of_view2: 0.00015
            acquire_sem: true
            acquire_fib: true
            acquire_image1: true
            acquire_image2: true
    Polishing:
        task_type: MILL_POLISHING
        parameters:
            sync_to_poi: true
        milling:
            mill_polishing:
                name: Polishing
                field_of_view: 4.0e-05
                channel: ION
                alignment:
                    enabled: false
                    interval_enabled: false
                    interval: 30
                    rect:
                        left: 0.7
                        top: 0.3
                        width: 0.25
                        height: 0.4
                    use_autocontrast: true
                    use_autofocus: false
                    steps: 3
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 1536
                        - 1024
                        dwell_time: 1.0e-06
                        hfw: 0.00015
                        autocontrast: false
                        autogamma: false
                        save: false
                        drift_correction: false
                acquisition:
                    acquire_sem: false
                    acquire_fib: false
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 1536
                        - 1024
                        dwell_time: 1.0e-06
                        hfw: 0.00015
                        autocontrast: false
                        autogamma: false
                        save: false
                        drift_correction: false
                stages:
                -   name: Adaptive Polishing
                    milling:
                        milling_current: 2.0e-11
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 4.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.0e-05
                        depth: 5.0e-08
                        spacing: 2.25e-07
                        upper_trench_height: 3.5e-07
                        lower_trench_height: 3.5e-07
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: AdaptivePolishing
                        config:
                            model_path: null
                            model_generation: 1.4fpn
                            gis_stop_min: 0.2e-6
                            gis_stop_median: 0.25e-6
                            max_crack_area: 2.0e-12
                            max_milling_cycles: 30
                            minimum_lamella_area: 30.0e-12
                            maximum_drift: 70.0e-6
                            align_sem: true
                            save_predictions: true
                            gis_filter_sigma: 1.6666666666666667
                            lamella_pad_x: 0.0
                -   name: Localised Adaptive Polishing
                    milling:
                        milling_current: 2.0e-11
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 4.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.0e-05
                        depth: 5.0e-08
                        spacing: 2.25e-07
                        upper_trench_height: 3.5e-07
                        lower_trench_height: 3.5e-07
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: BitmapAdaptivePolishing
                        config:
                            model_path: null
                            model_generation: 1.4fpn
                            gis_stop_min: 0.2e-6
                            gis_stop_median: 0.25e-6
                            max_crack_area: 2.0e-12
                            max_milling_cycles: 30
                            minimum_lamella_area: 30.0e-12
                            maximum_drift: 70.0e-6
                            align_sem: true
                            save_predictions: true
                            gis_filter_sigma: 1.6666666666666667
                            lamella_pad_x: 0.0
                            gis_max: 2.0e-6
                            gis_min: 0.15e-6
                            dwell_multiplier_mean_stop: 0.03
                            dwell_multiplier_max_stop: 0.05
                            bitmap_erosion_px: 20
                            bitmap_gaussian_sigma: 20
                            apply_boundary_smoothing: false
                            boundary_smoothing_sigma: 5.0
                            incident_angle_sputter_ratio: 4.3
                            incident_angle_scale_with_gis_min: false
                            mask_cracks: true
                            pattern_alignment: centre
        reference_imaging:
            imaging:
                beam_type: ELECTRON
                resolution:
                - 1536
                - 1024
                dwell_time: 1.0e-06
                hfw: 0.00015
                autocontrast: false
                autogamma: false
                save: false
                drift_correction: false
            field_of_view1: 0.00012
            field_of_view2: 0.00015
            acquire_sem: true
            acquire_fib: true
            acquire_image1: true
            acquire_image2: true
    Mill Fiducial:
        task_type: MILL_FIDUCIAL
        parameters:
            alignment_expansion: 100.0
        milling:
            fiducial:
                name: Fiducial
                field_of_view: 8.0e-05
                channel: ION
                alignment:
                    enabled: false
                    interval_enabled: false
                    interval: 30
                    rect:
                        left: 0.7
                        top: 0.3
                        width: 0.25
                        height: 0.4
                    use_autocontrast: true
                    use_autofocus: false
                    steps: 3
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 1536
                        - 1024
                        dwell_time: 1.0e-06
                        hfw: 0.00015
                        autocontrast: false
                        autogamma: false
                        save: false
                        drift_correction: false
                acquisition:
                    acquire_sem: false
                    acquire_fib: false
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 1536
                        - 1024
                        dwell_time: 1.0e-06
                        hfw: 0.00015
                        autocontrast: false
                        autogamma: false
                        save: false
                        drift_correction: false
                stages:
                -   name: Fiducial
                    milling:
                        milling_current: 2.0e-09
                        spot_size: 5.0e-08
                        rate: 3.0e-11
                        dwell_time: 1.0e-06
                        hfw: 8.0e-05
                        patterning_mode: Serial
                        application_file: Si
                        preset: 30 keV; 20 nA
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 2.5e-05
                            y: 0.0
                        width: 1.0e-06
                        height: 1.0e-05
                        depth: 1.0e-06
                        rotation: 45
                        cross_section: Rectangle
                        asymmetric: false
                        name: Fiducial
                    strategy:
                        name: Standard
                        config: {}
        reference_imaging:
            imaging:
                beam_type: ELECTRON
                resolution:
                - 1536
                - 1024
                dwell_time: 1.0e-06
                hfw: 0.00015
                autocontrast: false
                autogamma: false
                save: false
                drift_correction: false
            field_of_view1: 0.00012
            field_of_view2: 0.00015
            acquire_sem: true
            acquire_fib: true
            acquire_image1: true
            acquire_image2: true
    Setup Lamella Position:
        task_type: SELECT_MILLING_POSITION
        parameters:
            milling_angle: -23
            auto_milling_alignment: false
            use_autofocus: true
        milling: {}
        reference_imaging:
            imaging:
                beam_type: ELECTRON
                resolution:
                - 1536
                - 1024
                dwell_time: 1.0e-06
                hfw: 0.00015
                autocontrast: false
                autogamma: false
                save: false
                drift_correction: false
            field_of_view1: 0.00012
            field_of_view2: 0.00015
            acquire_sem: true
            acquire_fib: true
            acquire_image1: true
            acquire_image2: true
workflow:
    name: autolamella-adaptive-polish
    description: adaptive polish test protocol
    tasks:
    -   name: Setup Lamella Position
        supervise: false
        required: true
        requires: []
    -   name: Mill Fiducial
        supervise: false
        required: true
        requires: []
    -   name: Rough Milling
        supervise: false
        required: true
        requires:
        - Mill Fiducial
    -   name: Polishing
        supervise: false
        required: true
        requires:
        - Rough Milling
options:
    turn_beams_off: false
