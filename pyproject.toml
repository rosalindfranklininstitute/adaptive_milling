[build-system]
requires = [
  "setuptools >= 77.0.3, < 81",
  "setuptools_scm",
]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive_milling"
description = "Adaptive milling plugins for fibsemOS"
license = { file = "LICENSE" }
dynamic = [
  "version",
  "readme",
]
authors = [
  { name = "Elaine Ho", email = "elaine.ho@rfi.ac.uk" },
  { name = "Luis Perdigao", email = "luis.perdigao@rfi.ac.uk" },
  { name = "Thomas Fish", email = "thomas.fish@rfi.ac.uk" },
  { name = "Thomas Glen", email = "thomas.glen@rfi.ac.uk" },
  { name = "Casper Berger", email = "casper.berger@rfi.ac.uk" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.9"
dependencies = [
  "pandas",
  "matplotlib",
  "numpy",
  "scikit-image",
  "opencv-python-headless",
  "scipy",
  "tifffile",
  "imagecodecs",
  "albumentations",
  "segmentation-models-pytorch >= 0.4.0",
  "fibsem >= 0.5.0",
  "torch >= 2.7.0",
  "torchvision >= 0.22.0",
  "matplotlib_scalebar >= 0.8.1",
]

[project.urls]
"Source" = "https://github.com/rosalindfranklininstitute/adaptive_milling"
"Tracker" = "https://github.com/rosalindfranklininstitute/adaptive_milling/issues"

[tool.setuptools.dynamic]
readme = { file = "README.md", content-type = "text/markdown" }

[tool.setuptools_scm]
version_file = "src/adaptive_milling/_version.py"
version_scheme = "release-branch-semver"

[tool.setuptools.packages.find]
where = [
  "src",
]
exclude = [
  "tests",
  "scripts",
]

[project.optional-dependencies]
test = [
  "pytest",
  "pytest-cov",
  "jinja2",
  "Pillow",
  "adaptive_milling[ui]",
]
dev = [
  "ruff",
  "mypy",
  "microsoft-python-type-stubs@git+https://github.com/microsoft/python-type-stubs.git",
]
scripts = [
  "jupyter",
  "ipywidgets",
  "Pillow",
  "seaborn",
]
ui = [
  "pyqt5-qt5 == 5.15.2 ; platform_system == 'Windows'",
  "fibsem[ui] >= 0.5.0",
]
reporting = [
  "fibsem[reporting] >= 0.5.0",
]
all = [
  "adaptive_milling[test,dev,scripts,ui,reporting]",
]

# Extras that are linked with the PyTorch index for CPU or CUDA version (if using uv)
cpu = [
  "torch >= 2.7.0",
  "torchvision >= 0.22.0",
]
cu113 = [
  "torch >= 2.7.0",
  "torchvision >= 0.22.0",
]
cu118 = [
  "torch >= 2.7.0",
  "torchvision >= 0.22.0",
]
cu126 = [
  "torch >= 2.7.0",
  "torchvision >= 0.22.0",
]
cu128 = [
  "torch >= 2.7.0",
  "torchvision >= 0.22.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu113" },
    { extra = "cu118" },
    { extra = "cu126" },
    { extra = "cu128" },
  ],
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu113" },
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu118", extra = "cu113" },
  { index = "pytorch-cu118", extra = "cu118" },
  { index = "pytorch-cu126", extra = "cu126" },
  { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu113"
url = "https://download.pytorch.org/whl/cu113"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.entry-points.'fibsem.strategies']
# Make the strategy discoverable by fibsem
adaptive_polish = "adaptive_milling.strategy:AdaptivePolishMillingStrategy"
bitmap_adaptive_polish = "adaptive_milling.strategy:BitmapAdaptivePolishMillingStrategy"

[project.entry-points.'fibsem.patterns']
asymmetric_fiducial = "adaptive_milling.patterns:AsymmetricFiducialPattern"

[tool.pytest.ini_options]
addopts = "-vvvv --cov=src --cov-report term --cov-report html -p no:faulthandler -p no:napari -p no:napari-plugin-engine -p no:npe2"
testpaths = [
  "tests",
]
norecursedirs = [
  "tests/data",
  "htmlcov",
]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
follow_untyped_imports = true

[tool.ruff]
include = [
  "pyproject.toml",
  "src/**/*.py",
  "src/**/*.ipynb",
  "tests/**/*.py",
]
