name: autolamella-adaptive-polish
description: An example protocol for using the adaptive polish strategy. As a minimum, the model path will need to be updated to use this.
version: '1.0'
tasks:
    Rough Milling:
        task_type: MILL_ROUGH
        parameters:
            sync_polishing_position: true
            sync_to_poi: true
        milling:
            mill_rough:
                name: Rough Milling
                field_of_view: 6.0e-05
                channel: ION
                alignment:
                    enabled: true
                    interval_enabled: false
                    interval: 30
                    rect:
                        left: 0.7
                        top: 0.3
                        width: 0.25
                        height: 0.4
                    use_autocontrast: true
                    use_autofocus: false
                    steps: 3
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 3072
                        - 2048
                        dwell_time: 1.0e-06
                        hfw: 0.00015
                        autocontrast: false
                        autogamma: false
                        save: false
                        drift_correction: false
                acquisition:
                    acquire_sem: true
                    acquire_fib: true
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 3072
                        - 2048
                        dwell_time: 5.0e-08
                        hfw: 6.0e-05
                        autocontrast: false
                        autogamma: false
                        save: true
                        frame_integration: 16
                        drift_correction: false
                stages:
                -   name: Microexpansion
                    milling:
                        milling_current: 2.0e-09
                        spot_size: 5.0e-08
                        rate: 3.0e-11
                        dwell_time: 1.0e-06
                        hfw: 6.0e-05
                        patterning_mode: Serial
                        application_file: Si
                        preset: 30 keV; 2.5 nA
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 5.0e-07
                        height: 1.8e-05
                        depth: 2.0e-06
                        distance: 1.0e-05
                        name: MicroExpansion
                    strategy:
                        name: Standard
                        config: {}
                -   name: Rough 1
                    milling:
                        milling_current: 2.0e-09
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 6.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.1e-05
                        depth: 2.2e-06
                        spacing: 6.0e-06
                        upper_trench_height: 6.0e-06
                        lower_trench_height: 6.0e-06
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: Standard
                        config: {}
                -   name: Rough 2
                    milling:
                        milling_current: 7.4e-10
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 6.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                            name: null
                        width: 1.1e-05
                        depth: 1.8e-06
                        spacing: 3.0e-06
                        upper_trench_height: 3.0e-06
                        lower_trench_height: 3.0e-06
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: Standard
                        config: {}
        reference_imaging:
            imaging:
                beam_type: ELECTRON
                resolution:
                - 3072
                - 2048
                dwell_time: 1.0e-06
                hfw: 0.00015
                autocontrast: false
                autogamma: false
                save: false
                drift_correction: false
            field_of_view1: 0.00012
            field_of_view2: 0.00015
            acquire_sem: true
            acquire_fib: true
            acquire_image1: true
            acquire_image2: true
    Polishing:
        task_type: MILL_POLISHING
        parameters:
            sync_to_poi: true
        milling:
            mill_polishing:
                name: Polishing
                field_of_view: 6.0e-05
                channel: ION
                alignment:
                    enabled: true
                    interval_enabled: false
                    interval: 30
                    rect:
                        left: 0.7
                        top: 0.3
                        width: 0.25
                        height: 0.4
                    use_autocontrast: true
                    use_autofocus: false
                    steps: 3
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 3072
                        - 2048
                        dwell_time: 1.0e-06
                        hfw: 0.00015
                        autocontrast: false
                        autogamma: false
                        save: false
                        drift_correction: false
                acquisition:
                    acquire_sem: true
                    acquire_fib: true
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 3072
                        - 2048
                        dwell_time: 5.0e-08
                        hfw: 6.0e-05
                        autocontrast: false
                        autogamma: false
                        save: true
                        frame_integration: 16
                        drift_correction: false
                stages:
                -   name: Fine 1
                    milling:
                        milling_current: 2.0e-10
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 4.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.1e-05
                        depth: 1.3e-06
                        spacing: 1.3e-06
                        upper_trench_height: 1.25e-06
                        lower_trench_height: 1.25e-06
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: Standard
                        config: {}
                -   name: Fine 2
                    milling:
                        milling_current: 6.0e-11
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 6.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.0e-05
                        depth: 6.0e-07
                        spacing: 6.0e-07
                        upper_trench_height: 5.0e-07
                        lower_trench_height: 5.0e-07
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: Standard
                        config: {}
                -   name: Fine 3
                    milling:
                        milling_current: 2.0e-11
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 6.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.0e-05
                        depth: 4.0e-07
                        spacing: 4.0e-07
                        upper_trench_height: 2.5e-07
                        lower_trench_height: 2.5e-07
                        cross_section: Rectangle
                        time: 0.0
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: Standard
                        config: {}
                -   name: AdaptivePolishing
                    milling:
                        milling_current: 2.0e-11
                        spot_size: 5.0e-08
                        rate: 0.0001
                        dwell_time: 1.0e-06
                        hfw: 4.0e-05
                        patterning_mode: Parallel
                        application_file: Si
                        preset: ''
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 0.0
                            y: 0.0
                        width: 1.0e-05
                        depth: 5.0e-08
                        spacing: 2.0e-07
                        upper_trench_height: 3.5e-07
                        lower_trench_height: 3.5e-07
                        cross_section: Rectangle
                        time: 15
                        fillet: 0.0
                        name: Trench
                    strategy:
                        name: AdaptivePolishing
                        config:
                            model_path: null
                            model_generation: 1.0
                            gis_stop_min: 0.25e-06
                            gis_stop_median: 0.3e-06
                            max_crack_area: 0.1e-12
                            max_milling_cycles: 60
                            minimum_lamella_area: 30.0e-12
                            maximum_drift: 70.0e-06
                            align_sem: true
                            save_predictions: true
                            gis_filter_sigma: 1.6666666666666667
                            lamella_pad_x: 0.0
        reference_imaging:
            imaging:
                beam_type: ELECTRON
                resolution:
                - 3072
                - 2048
                dwell_time: 1.0e-06
                hfw: 0.00015
                autocontrast: false
                autogamma: false
                save: false
                drift_correction: false
            field_of_view1: 0.00012
            field_of_view2: 0.00015
            acquire_sem: true
            acquire_fib: true
            acquire_image1: true
            acquire_image2: true
    Mill Fiducial:
        task_type: MILL_FIDUCIAL
        parameters:
            alignment_expansion: 100.0
        milling:
            fiducial:
                name: Fiducial
                field_of_view: 6.0e-05
                channel: ION
                alignment:
                    enabled: false
                    interval_enabled: false
                    interval: 30
                    rect:
                        left: 0.7
                        top: 0.3
                        width: 0.25
                        height: 0.4
                    use_autocontrast: true
                    use_autofocus: false
                    steps: 3
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 3072
                        - 2048
                        dwell_time: 1.0e-06
                        hfw: 0.00015
                        autocontrast: false
                        autogamma: false
                        save: false
                        drift_correction: false
                acquisition:
                    acquire_sem: true
                    acquire_fib: true
                    imaging:
                        beam_type: ELECTRON
                        resolution:
                        - 3072
                        - 2048
                        dwell_time: 1.0e-06
                        hfw: 0.00015
                        autocontrast: false
                        autogamma: false
                        save: false
                        drift_correction: false
                stages:
                -   name: Fiducial
                    milling:
                        milling_current: 6.0e-11
                        spot_size: 5.0e-08
                        rate: 3.0e-11
                        dwell_time: 1.0e-06
                        hfw: 6.0e-05
                        patterning_mode: Serial
                        application_file: Si
                        preset: 30 keV; 20 nA
                        spacing: 1.0
                        milling_voltage: 30000.0
                        milling_channel: ION
                    pattern:
                        point:
                            x: 2.5e-05
                            y: 0.0
                        width: 0.1e-6
                        height: 10.0e-6
                        depth: 0.5e-6
                        rotation: 45.0
                        cross_section: Rectangle
                        name: AsymmetricFiducial
                    strategy:
                        name: Standard
                        config: {}
        reference_imaging:
            imaging:
                beam_type: ELECTRON
                resolution:
                - 3072
                - 2048
                dwell_time: 1.0e-06
                hfw: 0.00015
                autocontrast: false
                autogamma: false
                save: false
                drift_correction: false
            field_of_view1: 0.00012
            field_of_view2: 0.00015
            acquire_sem: true
            acquire_fib: true
            acquire_image1: true
            acquire_image2: true
    Setup Lamella Position:
        task_type: SELECT_MILLING_POSITION
        parameters:
            milling_angle: 15
            auto_milling_alignment: false
            use_autofocus: true
        milling: {}
        reference_imaging:
            imaging:
                beam_type: ELECTRON
                resolution:
                - 3072
                - 2048
                dwell_time: 1.0e-06
                hfw: 0.00015
                autocontrast: false
                autogamma: false
                save: false
                drift_correction: false
            field_of_view1: 0.00012
            field_of_view2: 0.00015
            acquire_sem: true
            acquire_fib: true
            acquire_image1: true
            acquire_image2: true
workflow:
    name: Adaptive Polish example
    description: An example protocol for using the adaptive polish strategy. As a minimum, the model path will need to be updated to use this.
    tasks:
    -   name: Setup Lamella Position
        supervise: false
        required: true
        requires: []
    -   name: Mill Fiducial
        supervise: false
        required: true
        requires: []
    -   name: Rough Milling
        supervise: false
        required: true
        requires:
        - Mill Fiducial
    -   name: Polishing
        supervise: false
        required: true
        requires:
        - Rough Milling
options:
    turn_beams_off: false
